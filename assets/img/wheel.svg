  <circle cx="200" cy="200" r="8" fill="#333" stroke="#666" stroke-width="0.5"/>

  <!-- Brake disk holes (decorative) -->
  <g fill="#111" opacity="0.5">
    <circle cx="200" cy="110" r="4"/>
    <circle cx="270" cy="145" r="4"/>
    <circle cx="290" cy="220" r="4"/>
    <circle cx="240" cy="285" r="4"/>
    <circle cx="160" cy="285" r="4"/>
    <circle cx="110" cy="220" r="4"/>
    <circle cx="130" cy="145" r="4"/>
    <circle cx="235" cy="100" r="3"/>
    <circle cx="300" cy="180" r="3"/>
    <circle cx="268" cy="265" r="3"/>
    <circle cx="188" cy="295" r="3"/>
    <circle cx="120" cy="260" r="3"/>
    <circle cx="102" cy="175" r="3"/>
    <circle cx="170" cy="105" r="3"/>
